# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.placeholders.adminUsername=${ADMIN_USERNAME}
spring.flyway.placeholders.adminPasswordHash=${ADMIN_PASSWORD_HASH}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiry-hours=${JWT_EXPIRY_HOURS:8}

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

# App
app.base-url=${APP_BASE_URL}
app.frontend-url=${FRONTEND_URL}
app.scheduler.interval-ms=${SCHEDULER_INTERVAL_MS:60000}
app.scheduler.reminder-window-minutes=${SCHEDULER_REMINDER_WINDOW_MINUTES:90}
